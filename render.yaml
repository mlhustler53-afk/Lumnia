services:
  - type: web
    name: lumnia-backend
    runtime: node
    rootDir: backend
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
      npm install && npm run build
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        value: https://lumnia-a2vb.vercel.app
      - key: NODE_VERSION
        value: "22"
      # Optional: Netscape cookies.txt for YouTube auth
      # - key: YTDLP_COOKIES
      #   value: /path/to/cookies.txt
