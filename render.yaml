services:
  - type: web
    name: lumnia-backend
    runtime: node
    rootDir: backend
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
      npm install && npm run build
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        value: https://lumnia-a2vb.vercel.app
      - key: NODE_VERSION
        value: "22"
      # Optional: Cobalt API instance for reliable YouTube audio extraction
      # - key: COBALT_API_URL
      #   value: https://cobalt-api.kwiatekmiki.com
      # Optional: Netscape cookies.txt for YouTube auth (base64 encoded)
      # - key: YTDLP_COOKIES_BASE64
      #   value: <base64-encoded-cookies.txt>
